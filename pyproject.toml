[project]
name = "sih-project"
version = "0.2.0"
description = "StatSkill AI — workforce skill gap analysis for statistical and analytics roles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "dotenv>=0.9.9",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pytest>=8.3.0",
]

[project.scripts]
statskill-build = "statskill.main:run_build"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]
